name: test windows

on:
  push:
    branches: [master]
    paths: &push_paths
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain.toml
      - lib/**
      - core/**
      - transports/**
      - desktop/**
      - cli/**
      - packaging/**
      - .github/workflows/test-windows.yml
  pull_request:
    paths: *push_paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-rust:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install rust
        run: rustup show active-toolchain
      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run shared and desktop tests
        run: >-
          cargo test --locked -p openscq30-lib -p openscq30-desktop
          -p openscl4-transport -p openscl4-protocol -p openscl4-transport-mock
          -p openscl4-models -p openscl4-session -p openscl4-transport-windows
          -p openscl4-profiles -p openscl4-diagnostics
      - name: Test the virtual CLI pilots
        run: cargo test --locked -p openscq30-cli --test pilot_a3954 --test pilot_a3062 --test pilot_a3949 --test pilot_a3028 --test pilot_a3035
