name: test android

on:
  push:
    branches: ["**"]
    paths: &push_paths
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain.toml
      - .build-tool-versions
      - lib/**
      - i18n/**
      - i18n-macros/**
      - uniffi-bindgen/**
      - android/**
      - .github/actions/install-android-build-tools/**
      - .github/workflows/test-android.yml
  pull_request:
    paths: *push_paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build tools
        uses: ./.github/actions/install-android-build-tools
        with:
          cache: true
          arch: x86_64

      - name: Install host library dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev libsqlite3-dev

      - name: Run android unit tests
        working-directory: android
        run: ./gradlew :buildSrc:test testX86_64DebugUnitTest
      # disabled since they're really slow
      # - name: Run android instrumented tests
      #   working-directory: android
      #   run: ./gradlew connectedAndroidTest
