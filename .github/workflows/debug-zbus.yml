name: debug zbus backtrace

on:
  push:
    branches: ["debug/zbus-backtrace"]

permissions:
  contents: read

jobs:
  build-and-run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spec/remaining-openscl4
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev libxkbcommon-dev libfontconfig1-dev libsqlite3-dev desktop-file-utils libxkbcommon-x11-0 dbus xvfb x11-utils openbox wmctrl fonts-dejavu-core
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p openscq30-desktop 2>&1 | tail -n 30
      - name: Run debug app with backtrace
        run: |
          set +e
          dbus-run-session -- xvfb-run -a bash -c 'RUST_BACKTRACE=full RUST_LOG=debug SLINT_RENDERER=software OPENSCL4_CONFIG_DIR=$(mktemp -d) timeout 10s ./target/debug/openscl4' 2>&1 | tail -n 220
          exit 0
