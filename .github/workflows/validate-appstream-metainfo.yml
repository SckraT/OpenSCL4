name: validate legacy GUI appstream metainfo

on:
  push:
    branches: [master]
    paths: &push_paths
      - gui/resources/com.oppzippy.OpenSCQ30.metainfo.xml
      - .github/workflows/validate-appstream-metainfo.yml
  pull_request:
    paths: *push_paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-appstream-metainfo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate
        run: appstreamcli validate gui/resources/com.oppzippy.OpenSCQ30.metainfo.xml
