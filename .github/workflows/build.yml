name: OpenSCL4 release builds

on:
  workflow_dispatch:
    inputs:
      unsigned_android:
        description: Build unsigned Android preview packages
        type: boolean
        default: true
      platforms:
        description: Platforms to build; linux skips Windows, Android and the complete preview bundle
        type: choice
        options: [all, linux]
        default: all
  push:
    tags:
      - "v*"

permissions:
  contents: read
  actions: read

jobs:
  source:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: source
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(python3 scripts/release.py version)
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "v$version" ]; then
            echo "Tag must match Cargo.toml version"
            exit 1
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: python3 -m unittest discover -s scripts/tests

  linux:
    needs: source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev libxkbcommon-dev libfontconfig1-dev libsqlite3-dev desktop-file-utils file dbus
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo fmt --all --check
      - run: cargo clippy --locked -p openscq30-lib -p openscq30-desktop -p openscq30-android --all-targets -- -D warnings
      - run: dbus-run-session -- cargo test --locked -p openscq30-lib -p openscq30-desktop -p openscq30-android
      - run: python3 scripts/release.py build linux
      - run: desktop-file-validate packaging/linux/io.github.sckrat.openscl4.desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-linux
          path: |
            build-output/*
            !build-output/*.AppImage
            !build-output/build-linux-appimage.json
          if-no-files-found: error
      # The same checkout and release binary packed as an AppImage, with its own report. It is not a release gate, so
      # its failure leaves this job, the .deb checks and the bundle; linux-appimage-check then finds no artifact and
      # fails, which still marks the run.
      - id: appimage
        continue-on-error: true
        run: python3 scripts/release.py build linux-appimage
      # Its own artifact, so a check can fetch it alone; artifact downloads do not keep its executable bit.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: steps.appimage.outcome == 'success'
        with:
          name: release-linux-appimage
          path: |
            build-output/*.AppImage
            build-output/build-linux-appimage.json
          if-no-files-found: error

  linux-package-check:
    needs: [source, linux]
    runs-on: ubuntu-24.04
    container: ubuntu:${{ matrix.ubuntu }}
    strategy:
      matrix:
        ubuntu: ["24.04", "26.04"]
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - run: apt-get update && apt-get install -y git ca-certificates curl unzip python3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - name: Fetch and install the built package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GH_REPO/actions/runs/$RUN_ID/artifacts?per_page=100" -o /tmp/artifacts.json
          url=$(python3 -c 'import json; data=json.load(open("/tmp/artifacts.json")); print(next(item["archive_download_url"] for item in data["artifacts"] if item["name"] == "release-linux"))')
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "$url" -o /tmp/linux.zip
          mkdir -p build-output
          unzip /tmp/linux.zip -d build-output
          apt-get install -y ./build-output/*.deb dbus x11-utils xvfb xauth openbox wmctrl weston fonts-dejavu-core
      - run: bash scripts/test-linux-package.sh /usr/bin/openscl4
      - run: apt-get remove -y openscl4

  # Starts the AppImage without FUSE, as a container or a system without fuse3 must. It is a later format, not a gate
  # of the first release, so the bundle does not wait for it.
  linux-appimage-check:
    needs: [source, linux]
    runs-on: ubuntu-24.04
    container: ubuntu:${{ matrix.ubuntu }}
    strategy:
      # a dependency update can break one release and not the other; each keeps its own result and logs
      fail-fast: false
      matrix:
        ubuntu: ["24.04", "26.04"]
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - run: apt-get update && apt-get install -y git ca-certificates curl unzip python3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - name: Fetch the built AppImage
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        # the artifact is missing when the AppImage build in the linux job failed; this check then fails with that reason
        run: |
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GH_REPO/actions/runs/$RUN_ID/artifacts?per_page=100" -o /tmp/artifacts.json
          url=$(python3 -c 'import json, sys; data=json.load(open("/tmp/artifacts.json")); print(next((item["archive_download_url"] for item in data["artifacts"] if item["name"] == "release-linux-appimage"), None) or sys.exit("No release-linux-appimage artifact: the AppImage build in the linux job failed"))')
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "$url" -o /tmp/appimage.zip
          mkdir -p build-output
          unzip /tmp/appimage.zip -d build-output
          chmod +x build-output/*.AppImage
      - name: Install the runtime dependencies and the test sessions
        # The AppImage carries the application, not the system libraries: it needs the same Depends as the .deb.
        run: |
          depends=$(sed -n 's/^Depends: //p' packaging/linux/control | sed 's/ *([^)]*)//g; s/,/ /g')
          apt-get install -y $depends dbus x11-utils xvfb xauth openbox wmctrl weston fonts-dejavu-core
      - run: bash scripts/test-linux-appimage.sh build-output/*.AppImage appimage-logs
      # the script also prints them in the job log; an attempt keeps its own, so a rerun does not replace them
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: linux-appimage-check-logs-${{ matrix.ubuntu }}-attempt-${{ github.run_attempt }}
          path: appimage-logs
          if-no-files-found: ignore

  windows:
    needs: source
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo test --locked -p openscq30-lib -p openscq30-desktop
      - name: Locate installer compiler
        shell: pwsh
        run: |
          $innoVersion = (Get-Content .build-tool-versions | Where-Object { $_ -like 'innosetup *' }).Split(' ')[1]
          $innoTag = $innoVersion.Replace('.', '_')
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest "https://github.com/jrsoftware/issrc/releases/download/is-$innoTag/innosetup-$innoVersion.exe" -OutFile $setup
          $signature = Get-AuthenticodeSignature -LiteralPath $setup
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notlike '*Pyrsys B.V.*') { throw 'Invalid Inno Setup signature' }
          $compilerDir = Join-Path (Get-Location) '.local/iscc'
          $installer = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$compilerDir" -WindowStyle Hidden -PassThru -Wait
          if ($installer.ExitCode -ne 0) { throw 'Inno Setup installation failed' }
          "ISCC=$compilerDir/ISCC.exe" >> $env:GITHUB_ENV
      - run: python scripts/release.py build windows
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-windows
          path: build-output/*
          if-no-files-found: error

  android:
    needs: source
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64, x86]
    env:
      UNSIGNED_ANDROID: ${{ github.event_name == 'workflow_dispatch' && inputs.unsigned_android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev libsqlite3-dev
      - uses: ./.github/actions/install-android-build-tools
        with:
          cache: true
          arch: ${{ matrix.abi }}
      - name: Configure OpenSCL4 signing
        if: env.UNSIGNED_ANDROID != 'true'
        env:
          OPENSCL4_KEYSTORE_BASE64: ${{ secrets.OPENSCL4_KEYSTORE_BASE64 }}
          OPENSCL4_KEY_PASSWORD: ${{ secrets.OPENSCL4_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          encoded = os.environ['OPENSCL4_KEYSTORE_BASE64']
          password = os.environ['OPENSCL4_KEY_PASSWORD']
          if not encoded or not password:
              raise SystemExit('Configure the OpenSCL4 release signing secrets before a signed build')
          os.umask(0o077)
          key = Path('.local/signing/openscl4.p12').resolve()
          key.parent.mkdir(parents=True, exist_ok=True)
          key.write_bytes(base64.b64decode(encoded, validate=True))
          Path('android/openscl4-keystore.properties').write_text(
              f'storeFile={key}\nstorePassword={password}\nkeyPassword={password}\nkeyAlias=openscl4\n',
              encoding='utf-8',
          )
          PY
      - name: Test Android adapter and shared fixtures
        if: matrix.abi == 'x86_64'
        working-directory: android
        run: ./gradlew testX86_64DebugUnitTest
      - name: Build APK
        env:
          ABI: ${{ matrix.abi }}
        run: |
          options=()
          if [ "$UNSIGNED_ANDROID" = true ]; then options+=(--unsigned); fi
          python3 scripts/release.py build android --abi "$ABI" "${options[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-android-${{ matrix.abi }}
          path: build-output/*
          if-no-files-found: error

  bundle:
    needs: [source, linux, linux-package-check, windows, android]
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - name: Collect platform artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh run download "$RUN_ID" --pattern 'release-*' --dir target/artifacts
          mkdir -p build-output
          find target/artifacts -type f -exec cp -t build-output -- {} +
      - run: python3 scripts/release.py verify --preview
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: openscl4-${{ needs.source.outputs.version }}-preview
          path: build-output/*
          if-no-files-found: error
      - run: echo 'Build set verified. Stable publication remains manual after Linux session and real-device checks.' >> "$GITHUB_STEP_SUMMARY"

  release:
    # Publishing is limited to a version tag: a manual run only proves the build and keeps its artifact. The set is
    # always published as a pre-release, because CI verifies it with `verify --preview` and cannot run the Linux
    # session and real-device checks that a stable release requires.
    needs: [source, bundle]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    # A job-level permissions block replaces the workflow-level one, so `actions: read` has to be repeated here for
    # `gh run download`; `contents: write` is what publishing a release needs.
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      TAG: ${{ github.ref_name }}
      COMMIT: ${{ needs.source.outputs.commit }}
      VERSION: ${{ needs.source.outputs.version }}
    steps:
      - name: Fetch the verified bundle
        run: |
          gh run download "$RUN_ID" --pattern 'openscl4-*-preview' --dir staging
          mkdir -p assets
          find staging -type f -exec cp -t assets -- {} +
          test -f assets/SHA256SUMS || { echo 'Verified bundle has no SHA256SUMS'; exit 1; }
          ls -l assets
      - name: Write release notes
        run: |
          {
            echo "Preview package set for OpenSCL4 $VERSION, built from \`$COMMIT\`."
            echo
            echo 'This release is a **pre-release**. The bundle passed `python scripts/release.py verify --preview`:'
            echo 'a complete set of Windows, Linux and four Android ABI packages with matching version, source'
            echo 'revision, identity, tool pins, Android signing certificate and package hashes.'
            echo
            echo 'The AppImage is attached, with its report, only when its own build succeeded; it is not a release'
            echo 'gate, so its absence does not weaken the rest of the set.'
            echo
            echo 'It is not a stable release. Stable promotion needs the Linux session matrix and a real Liberty 4 Pro'
            echo 'check for this commit, which CI does not run; see `docs/build-release.md`. The packages, checksums and'
            echo 'build reports are attached, so a maintainer can promote this release after those checks pass.'
            echo
            echo '`SHA256SUMS` covers every attached package:'
            echo
            echo '```'
            cat assets/SHA256SUMS
            echo '```'
          } > notes.md
      - name: Publish pre-release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber
            gh release edit "$TAG" --notes-file notes.md --prerelease
          else
            gh release create "$TAG" assets/* \
              --title "OpenSCL4 $VERSION" \
              --notes-file notes.md \
              --prerelease
          fi
          gh release view "$TAG" --json url,isPrerelease,assets --jq '"\(.url) prerelease=\(.isPrerelease) assets=\(.assets|length)"' >> "$GITHUB_STEP_SUMMARY"
