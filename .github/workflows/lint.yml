name: lint

on:
  push:
    branches: [master]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install basic requirements
        # libfontconfig1-dev for openscq30-desktop, which Slint draws
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev libxkbcommon-dev libfontconfig1-dev libsqlite3-dev
      - name: Install rust
        run: rustup show active-toolchain
      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run clippy
        run: cargo clippy --locked -p openscq30-lib -p openscq30-desktop -p openscq30-android -- -D warnings

  documentation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check README template, release scripts and workflow concurrency
        run: python3 -m unittest discover -s scripts/tests -v

  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install just
        run: sudo snap install just --classic
      - name: Install rust
        run: rustup show active-toolchain
      - name: Install ktlint
        run: |
          curl --silent --show-error --remote-name-all --location https://github.com/pinterest/ktlint/releases/download/1.8.0/ktlint{,.asc}
          curl -sS https://raw.githubusercontent.com/pinterest/ktlint/1e1cdd6b3c7dfc94c9418c7c4706c0dcffcb132c/public-key.asc | gpg --import
          gpg --verify ktlint.asc
          chmod a+x ktlint && sudo mv ktlint /usr/local/bin/
      - name: Install prettier
        run: npm install --global --ignore-scripts prettier@3.9.10
      - name: Check formatting
        run: just format-check

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck fd-find
      - name: Install just
        run: sudo snap install just --classic
      - name: Run shellcheck
        run: just shellcheck
