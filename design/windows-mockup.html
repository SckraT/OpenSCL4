<style id="desktop-pages">

.range-control .range{margin:0;flex:1}

const $ = id => document.getElementById(id);
function icon(name, cls = '') { return `<svg class="i ${cls}" aria-hidden="true"><use href="#i-${name}"></use></svg>`; }
function icons(root = document) {
  root.querySelectorAll('[data-icon]').forEach(el => { el.innerHTML = icon(el.dataset.icon); el.removeAttribute('data-icon'); });
}
function esc(value) {
  return String(value).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function btn(label, action, ico = '', style = '', extra = '') {
  return `<button class="btn ${style}" data-action="${action}" ${extra}>${ico ? icon(ico) : ''}<span>${label}</span></button>`;
}
function note(text, warm = false) { return `<div class="note ${warm ? 'warm' : ''}">${icon('info')}<span>${text}</span></div>`; }
function panelHeading(title, ico, link = '') {
  return `<div class="panel-heading"><div class="section-icon">${icon(ico)}<h2>${title}</h2></div>${link}</div>`;
}
function pageLink(page, label = 'Настроить') { return `<button class="text-link" data-page="${page}">${label}${icon('chevron')}</button>`; }
function copyButton(text, label) {
  return `<button class="icon-btn copy" data-action="copy" data-text="${esc(text)}" title="Копировать" aria-label="Копировать: ${esc(label)}">${icon('copy')}</button>`;
}

// ---- Numbers as the Android app shows them: comma, real minus, kilohertz ------------------------------------------
const MINUS = '−';
function decimal(value, digits = 0) { return (value < 0 ? MINUS : '') + Math.abs(value).toFixed(digits).replace('.', ','); }
function db(units, eq) { return decimal(units / 10 ** eq.digits, eq.digits); }
function signedDb(units, eq) { return (units > 0 ? '+' : '') + db(units, eq); }
function frequency(hz) { return hz < 1000 ? `${hz} Гц` : `${decimal(hz / 1000, hz % 1000 ? 1 : 0)} кГц`; }

const usesScale = () => !!device().scale && app.modesView === 'scale';

// ---- Equalizer chart -----------------------------------------------------------------------------------------------
const CHART = { left: 40, right: 566, top: 16, bottom: 188, height: 206, miniTop: 8, miniBottom: 106, miniHeight: 114 };
function eqSvg(values, eq, full = false, id = '') {
  const n = values.length, x = i => CHART.left + i * (CHART.right - CHART.left) / Math.max(n - 1, 1);
  const top = full ? CHART.top : CHART.miniTop, bottom = full ? CHART.bottom : CHART.miniBottom;
  const y = v => bottom - (Math.max(eq.min, Math.min(eq.max, v)) - eq.min) / (eq.max - eq.min) * (bottom - top);
  const pts = values.map((v, i) => [x(i), y(v)]);
  let curve = `M${pts[0].join(' ')}`;
  for (let i = 1; i < pts.length; i++) { const mid = (pts[i - 1][0] + pts[i][0]) / 2; curve += ` C${mid} ${pts[i - 1][1]} ${mid} ${pts[i][1]} ${pts[i].join(' ')}`; }
  const unit = 10 ** eq.digits, half = v => Math.round(v / 2 / unit) * unit;
  const grid = full ? [eq.max, half(eq.max), 0, half(eq.min), eq.min] : [eq.max, 0, eq.min];
  const gradient = `eq-fill-${id || 'mini'}`;
  return `<svg ${id ? `id="${id}"` : ''} class="${full ? 'eq-main' : 'mini-eq'}" viewBox="0 0 600 ${full ? CHART.height : CHART.miniHeight}" preserveAspectRatio="none" role="img" aria-label="Кривая эквалайзера"><defs><linearGradient id="${gradient}" x1="0" y1="0" x2="0" y2="1"><stop stop-color="var(--primary)" stop-opacity=".2"/><stop offset="1" stop-color="var(--primary)" stop-opacity=".015"/></linearGradient></defs>${grid.map(v => `<line x1="${CHART.left}" y1="${y(v)}" x2="${CHART.right}" y2="${y(v)}" stroke="var(--line)" stroke-width=".8" ${v === 0 ? '' : 'stroke-dasharray="3 5"'}/>${full ? `<text x="2" y="${y(v) + 3}" fill="var(--muted)" font-size="9" font-family="Onest">${signedDb(v, eq)}</text>` : ''}`).join('')}${full ? pts.map(([px]) => `<line x1="${px}" y1="${top}" x2="${px}" y2="${bottom}" stroke="var(--line)" stroke-opacity=".32" stroke-dasharray="2 6"/>`).join('') : ''}<path d="${curve} L${CHART.right} ${bottom} L${CHART.left} ${bottom} Z" fill="url(#${gradient})"/><path d="${curve}" fill="none" stroke="var(--primary)" stroke-width="${full ? 2.6 : 2.2}" stroke-linecap="round" vector-effect="non-scaling-stroke"/>${full ? pts.map(([px, py], i) => `<circle data-band-point="${i}" cx="${px}" cy="${py}" r="5" fill="var(--surface)" stroke="var(--primary)" stroke-width="2.2"/>`).join('') : ''}</svg>`;
}
function eqName() {
  const e = ds().equalizer;
  if (e.preset) return profileLabel(e.preset);
  return e.custom || 'Свои настройки';
}
function eqRange(eq) { return `${db(eq.min, eq)}…${signedDb(eq.max, eq)} дБ`; }

function stateScreen() {

  const speaker = device().kind === 'speaker';
  if (app.bluetoothOff) return `<div class="connection-state">${icon('bluetooth')}<h1>Bluetooth выключен</h1><p>Включите Bluetooth в параметрах Windows, затем снова попробуйте подключиться к ${speaker ? 'колонке' : 'наушникам'}.</p>${btn('Параметры Bluetooth', 'windows-settings', 'external', 'primary', 'data-uri="ms-settings:bluetooth"')}${btn('Мои устройства', 'go-devices', 'devices')}</div>`;

  if (s.connection === 'connecting') return `<div class="connection-state"><div class="connecting-spinner"></div><h1>Подключаем ${speaker ? 'колонку' : 'наушники'}</h1><p>${speaker ? 'Включите колонку.' : 'Откройте кейс или включите наушники.'} Управление станет доступно после подключения.</p>${btn('Отменить', 'cancel-connect')}</div>`;

  return `<div class="connection-state">${icon('disconnect')}<h1>${esc(device().name)} не подключено</h1><p>Подключите, чтобы видеть заряд и менять настройки.</p>${btn('Подключить', 'reconnect', 'bluetooth', 'primary')}${btn('Мои устройства', 'go-devices', 'devices')}</div>`;

document.addEventListener('keydown', e => {
  const modal = document.querySelector('.dialog');
  if (e.key === 'Escape') {

    if (modal) { closeDialog(); return; }
    $('tray-root').innerHTML = '';

  }
  if (modal && e.key === 'Tab') {
    const nodes = [...modal.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea,a[href]')].filter(x => x.getClientRects().length);
    if (!nodes.length) return;
    const first = nodes[0], last = nodes[nodes.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); } else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    return;
  }
  if (modal && e.key === 'Enter' && e.target.matches('input[type=text]')) { e.preventDefault(); modal.querySelector('.dialog-actions .primary')?.click(); return; }
  if (modal) return;
  if (e.ctrlKey && e.key.toLowerCase() === 'k') { e.preventDefault(); searchDialog(); return; }
  if (e.ctrlKey && e.key === ',') { e.preventDefault(); navigate('settings'); return; }
  if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 's' && app.device) { e.preventDefault(); createPresetDialog(); return; }

});
function chartValue(e, chart) {
  const eq = device().equalizer, bounds = chart.getBoundingClientRect();
  const x = (e.clientX - bounds.left) / bounds.width * 600, y = (e.clientY - bounds.top) / bounds.height * CHART.height;
  const index = Math.max(0, Math.min(eq.bands.length - 1, Math.round((x - CHART.left) / ((CHART.right - CHART.left) / (eq.bands.length - 1)))));

}
document.addEventListener('pointerdown', e => {
  const chart = e.target.closest('#equalizer-chart');

document.addEventListener('pointermove', e => {

const endDrag = () => { if (dragBand !== null) { dragBand = null; turnOffSpatial(); render(true); } };
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);
document.addEventListener('dragstart', e => { const row = e.target.closest('[data-layout-row]'); if (row) e.dataTransfer.setData('text/plain', row.dataset.layoutRow); });
document.addEventListener('dragover', e => { if (e.target.closest('[data-layout-row]')) e.preventDefault(); });
document.addEventListener('drop', e => {
  const row = e.target.closest('[data-layout-row]');
  if (!row) return;
  e.preventDefault();
  const from = e.dataTransfer.getData('text/plain');
  if (/^\d+$/.test(from)) moveLayoutBlock(Number(from), Number(row.dataset.layoutRow));
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (app.theme === 'system') render(true); });
new MutationObserver(() => {
  const theme = document.documentElement.dataset.theme;
  if (theme === appliedTheme) return;
  hostTheme = ['light', 'dark'].includes(theme) ? theme : null;
  if (app.theme === 'system') render(true);
}).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
render();
icons();
