[package]
name = "openscq30-desktop"
description = "OpenSCQ30 for Windows, built with Slint"
edition = "2024"
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
openscq30-lib = { workspace = true }
slint = { workspace = true, features = ["unstable-winit-030"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
anyhow = { workspace = true }
tokio = { workspace = true, features = ["fs"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }
macaddr = { workspace = true }
strum = { workspace = true }
openscq30-i18n = { workspace = true }
i18n-embed = { workspace = true, features = ["desktop-requester"] }
dirs = { workspace = true }
open = { workspace = true }
arboard = { workspace = true }
rfd = { workspace = true, features = ["xdg-portal", "tokio"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile = { workspace = true }
roxmltree = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_Registry", "Win32_System_Threading"] }

[build-dependencies]
slint-build = { workspace = true }

[target.'cfg(windows)'.build-dependencies]
tempfile = { workspace = true }
embed-resource = { workspace = true }
